<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — VerdictAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-aurora" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="grid-overlay"></div>
    <div class="noise"></div>
  </div>

  <div class="auth-page">
    <div class="glass auth-card reveal">
      <div class="auth-logo">V</div>
      <h1 class="h3 text-center mb-1">Create your account</h1>
      <p class="text-center text-muted-va small mb-4">Start analyzing legal documents in minutes</p>

      <form id="register-form" action="dashboard.html" method="get" novalidate>
        <div class="mb-3">
          <label class="form-label-premium" for="name">Full name</label>
          <input class="form-control-premium" type="text" id="name" name="name" placeholder="Aditya Sharma" required>
        </div>
        <div class="mb-3">
          <label class="form-label-premium" for="email">Email</label>
          <input class="form-control-premium" type="email" id="email" name="email" placeholder="you@university.edu" required>
          <div id="email-error" hidden></div>
        </div>
        <div class="mb-3">
          <label class="form-label-premium" for="password">Password</label>
          <input class="form-control-premium" type="password" id="password" name="password" placeholder="At least 8 characters" required>
          <div id="password-error" hidden></div>
        </div>
        <div class="mb-4">
          <label class="form-label-premium" for="confirm">Confirm password</label>
          <input class="form-control-premium" type="password" id="confirm" name="confirm" placeholder="Repeat password" required>
        </div>
        <button type="submit" class="btn-premium w-100" id="register-btn">Create Account</button>
      </form>

      <div class="divider-fade"></div>
      <div class="d-flex gap-2 mb-4">
        <button type="button" class="social-btn"><i class="bi bi-google"></i> Google</button>
        <button type="button" class="social-btn"><i class="bi bi-github"></i> GitHub</button>
      </div>

      <p class="text-center small text-muted-va mb-0">
        Already have an account? <a href="login.html" style="color:#a5b4fc;">Sign in</a>
      </p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
