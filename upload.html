<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload — VerdictAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-aurora" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="noise"></div>
  </div>

  <div class="app-shell">
    <aside class="sidebar">
      <a href="index.html" class="brand mb-3 px-2"><span class="brand-mark">V</span> VerdictAI</a>
      <a class="sidebar-link" href="dashboard.html"><i class="bi bi-grid-1x2"></i> Dashboard</a>
      <a class="sidebar-link" href="workspace.html"><i class="bi bi-layout-sidebar"></i> Workspace</a>
      <a class="sidebar-link active" href="upload.html"><i class="bi bi-cloud-arrow-up"></i> Upload</a>
      <a class="sidebar-link" href="documents.html"><i class="bi bi-folder2-open"></i> Documents</a>
      <a class="sidebar-link" href="history.html"><i class="bi bi-clock-history"></i> History</a>
      <a class="sidebar-link" href="settings.html"><i class="bi bi-sliders"></i> Settings</a>
    </aside>

    <main class="app-main">
      <p class="section-label mb-2">Ingest</p>
      <h1 class="h3 mb-2">Upload a legal document</h1>
      <p class="text-muted-va mb-4" style="max-width:36rem;">
        Drop a PDF, DOCX, or image. You’ll wire the real upload logic in JavaScript later —
        this UI is ready for you.
      </p>

      <label class="dropzone glass mb-4" for="file-input" id="dropzone">
        <input type="file" id="file-input" accept=".pdf,.doc,.docx,.png,.jpg,.jpeg" hidden>
        <div class="dropzone-icon"><i class="bi bi-cloud-arrow-up"></i></div>
        <h2 class="h5 mb-2">Drop your file here</h2>
        <p class="text-muted-va small mb-3">or click to browse · PDF, DOCX, PNG, JPG</p>
        <span class="btn-ghost btn-sm-premium">Choose file</span>

        <!-- Progress UI placeholders for your JS -->
        <div id="upload-progress" class="w-100 mt-4" hidden>
          <div class="progress-ring-wrap"></div>
          <p class="small text-muted-va mb-0" id="upload-status">Uploading…</p>
          <div class="progress mx-auto mt-2" style="height:6px;max-width:240px;background:rgba(148,163,184,.15);">
            <div class="progress-bar" id="upload-bar" style="width:0%;background:linear-gradient(90deg,var(--primary),var(--accent));"></div>
          </div>
        </div>
      </label>

      <div class="glass p-4" id="upload-result" hidden>
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
          <div>
            <div class="badge-soft mb-2"><i class="bi bi-check-circle"></i> Ready</div>
            <h3 class="h5 mb-1" id="uploaded-name">document.pdf</h3>
            <p class="small text-muted-va mb-0" id="uploaded-meta">—</p>
          </div>
          <a href="workspace.html" class="btn-premium" id="open-workspace-cta">
            Open in Workspace <i class="bi bi-arrow-right"></i>
          </a>
        </div>
      </div>

      <div class="row g-3 mt-2" id="upload-queue">
        <!-- Your JS can append uploaded file cards here -->
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
