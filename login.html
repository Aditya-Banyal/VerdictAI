<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — VerdictAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-aurora" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="grid-overlay"></div>
    <div class="noise"></div>
  </div>

  <div class="auth-page">
    <div class="glass auth-card reveal">
      <div class="auth-logo">V</div>
      <h1 class="h3 text-center mb-1">Welcome back</h1>
      <p class="text-center text-muted-va small mb-4">Sign in to your VerdictAI workspace</p>

      <form id="login-form" action="dashboard.html" method="get" novalidate>
        <div class="mb-3">
          <label class="form-label-premium" for="email">Email</label>
          <input class="form-control-premium" type="email" id="email" name="email" placeholder="you@firm.com" required>
          <div class="invalid-feedback d-block" id="email-error" hidden></div>
        </div>
        <div class="mb-3">
          <label class="form-label-premium" for="password">Password</label>
          <input class="form-control-premium" type="password" id="password" name="password" placeholder="••••••••" required>
          <div class="invalid-feedback d-block" id="password-error" hidden></div>
        </div>
        <div class="d-flex justify-content-between align-items-center mb-4">
          <label class="small text-muted-va d-flex align-items-center gap-2 mb-0">
            <input type="checkbox" id="remember"> Remember me
          </label>
          <a href="#" class="small" style="color:#a5b4fc;">Forgot password?</a>
        </div>
        <button type="submit" class="btn-premium w-100" id="login-btn">
          Sign In
        </button>
      </form>

      <div class="divider-fade"></div>
      <p class="text-center small text-muted-va mb-3">Or continue with</p>
      <div class="d-flex gap-2 mb-4">
        <button type="button" class="social-btn"><i class="bi bi-google"></i> Google</button>
        <button type="button" class="social-btn"><i class="bi bi-github"></i> GitHub</button>
      </div>

      <p class="text-center small text-muted-va mb-0">
        New here? <a href="register.html" style="color:#a5b4fc;">Create an account</a>
      </p>
      <p class="text-center mt-3 mb-0">
        <a href="index.html" class="small text-muted-va"><i class="bi bi-arrow-left"></i> Back to home</a>
      </p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
